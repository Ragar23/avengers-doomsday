# Publishes this repository as its own Pages site, at the root:
#
#   /   doomsday — Avengers: Doomsday
#
# The game is plain HTML, CSS and ES modules, so there is nothing to build;
# the job only decides what does not belong on the site.
#
# Pages must be set to "GitHub Actions" under Settings -> Pages, not
# "Deploy from a branch", or this workflow builds and nothing goes live.
# The job cannot do that for itself: creating a Pages site needs
# `administration: write`, and a workflow's GITHUB_TOKEN has no such
# permission to request.
name: Deploy to Pages

on:
  push:
    branches: [doomsday]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a second push queues behind this run rather than
# racing it to the same site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          set -euo pipefail
          # Everything the browser needs, and nothing else: the art
          # generators and the smoke test do not belong on the site.
          mkdir -p site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tools' \
                   --exclude 'node_modules' --exclude 'site' ./ site/
          # Serve the files as they are; no Jekyll pass.
          touch site/.nojekyll
          test -f site/index.html || { echo "missing site/index.html"; exit 1; }
          echo "ok  site/index.html"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
